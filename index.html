<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸運推球抽獎機 | 莒光資優Ya!</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Import Map for Modules -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
            "lucide-react": "https://esm.sh/lucide-react@0.469.0?external=react",
            "matter-js": "https://esm.sh/matter-js@0.19.0",
            "firebase/app": "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js"
        }
    }
    </script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #020617; }
        
        /* Custom Animations */
        @keyframes internal-drop { 
            0% { transform: translate(-50%, 0) rotate(0deg); opacity: 0; } 
            20% { opacity: 1; } 
            80% { transform: translate(-50%, 180px) rotate(360deg); opacity: 1; } 
            100% { transform: translate(-50%, 200px) rotate(400deg); opacity: 0; } 
        }
        .animate-internal-drop { animation: internal-drop 2s cubic-bezier(0.45, 0, 0.55, 1) forwards; }
        
        @keyframes pop-out-open { 
            0% { transform: translateY(100px) scale(0.5); opacity: 0; } 
            40% { transform: translateY(-20px) scale(1.1); opacity: 1; } 
            100% { transform: translateY(0) scale(1); opacity: 1; } 
        }
        .animate-pop-out-open { animation: pop-out-open 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        
        @keyframes open-lid { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(-110deg) translate(-10px, -20px); } 
        }
        .animate-open-lid { animation: open-lid 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s forwards; }
        
        .animate-spin-slow { animation: spin 3s linear infinite; }
        .animate-wobble-spin { animation: spin 1s linear infinite; }
        .ease-out-back { transition-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
        
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
        @keyframes bounce { 0%, 100% { transform: translateY(-25%); animation-timing-function: cubic-bezier(0.8,0,1,1); } 50% { transform: none; animation-timing-function: cubic-bezier(0,0,0.2,1); } }
        @keyframes pulse { 50% { opacity: .5; } }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        .animate-ping { animation: ping 1s cubic-bezier(0, 0, 0.2, 1) infinite; }
        .animate-bounce { animation: bounce 1s infinite; }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Settings, Play, Download, Trash2, Plus, Gift, Award, RotateCcw, Lock, Cloud, CloudUpload, CloudDownload, Search, List, CircleDot, WifiOff, FileText, Sparkles, Music, Coins, RefreshCw, Copy, Check } from 'lucide-react';
        import Matter from 'matter-js';
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, doc, setDoc, getDoc } from 'firebase/firestore';

        // --- ⚠️ 部署設定區 (DEPLOYMENT CONFIGURATION) ⚠️ ---
        // 請將下方的物件內容替換為您的 Firebase Console > Project Settings 中的設定
        // 如果您是在預覽環境中運行，系統會自動使用環境變數，不需要修改。
        
        const getFirebaseConfig = () => {
            if (typeof __firebase_config !== 'undefined') {
                return JSON.parse(__firebase_config);
            }
            return {
                apiKey: "YOUR_API_KEY_HERE",
                authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
                projectId: "YOUR_PROJECT_ID",
                storageBucket: "YOUR_PROJECT_ID.appspot.com",
                messagingSenderId: "YOUR_SENDER_ID",
                appId: "YOUR_APP_ID"
            };
        };

        const getAppId = () => {
             if (typeof __app_id !== 'undefined') return __app_id;
             return 'lottery-game-deploy'; // 預設 App ID
        };

        // --- Firebase Init ---
        const firebaseConfig = getFirebaseConfig();
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = getAppId();

        // --- Matter.js Aliases ---
        const Engine = Matter.Engine;
        const Render = Matter.Render;
        const World = Matter.World;
        const Bodies = Matter.Bodies;
        const Body = Matter.Body;
        const Runner = Matter.Runner;
        const Composite = Matter.Composite;
        const Events = Matter.Events;
        const Common = Matter.Common;
        const Vector = Matter.Vector;

        // --- Constants & Config ---
        const ADMIN_PASSWORD = "8557";
        const STORAGE_KEY_PRIZES = "lottery_prizes_v2";
        const STORAGE_KEY_CODES = "lottery_codes_v2";
        const STORAGE_KEY_CLOUD_ID = "lottery_cloud_id";
        const CLOUD_COLLECTION_NAME = "lottery_saves_v2";

        // --- Utility Functions ---
        const generateCode = () => {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            let result = "";
            for (let i = 0; i < 3; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        };

        // --- Sound Effect (Web Audio API) ---
        const playWinSound = (type = 'small') => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                
                const now = ctx.currentTime;
                
                let notes = [];
                
                if (type === 'big') {
                    // Fanfare (Celebratory)
                    notes = [
                        { f: 523.25, t: 0, d: 0.1, type: 'triangle' },   // C5
                        { f: 659.25, t: 0.1, d: 0.1, type: 'triangle' }, // E5
                        { f: 783.99, t: 0.2, d: 0.1, type: 'triangle' }, // G5
                        { f: 1046.50, t: 0.3, d: 0.4, type: 'triangle' },// C6
                        { f: 783.99, t: 0.7, d: 0.1, type: 'triangle' }, // G5
                        { f: 1046.50, t: 0.8, d: 0.6, type: 'triangle' } // C6 (Long)
                    ];
                } else if (type === 'small') {
                    // Happy Ding-Dong (Success)
                    notes = [
                        { f: 659.25, t: 0, d: 0.1, type: 'sine' },   // E5
                        { f: 880.00, t: 0.15, d: 0.1, type: 'sine' }, // A5
                        { f: 1046.50, t: 0.3, d: 0.4, type: 'sine' }  // C6
                    ];
                } else {
                    // None/Lose (Descending/Sad)
                    notes = [
                        { f: 440.00, t: 0, d: 0.2, type: 'triangle' },   // A4
                        { f: 415.30, t: 0.2, d: 0.2, type: 'triangle' }, // G#4
                        { f: 392.00, t: 0.4, d: 0.4, type: 'triangle' }  // G4
                    ];
                }

                notes.forEach(({ f, t, d, type }) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.type = type;
                    osc.frequency.value = f;
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    const startTime = now + t;
                    osc.start(startTime);
                    
                    // Envelope for smoother sound
                    gain.gain.setValueAtTime(0, startTime);
                    gain.gain.linearRampToValueAtTime(0.3, startTime + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + d);
                    
                    osc.stop(startTime + d);
                });
            } catch (e) {
                console.error("Audio play failed", e);
            }
        };

        // --- Helper: Create Capsules ---
        const createCapsule = (x, y, type = 'normal') => {
            const size = 28; 
            
            const colors = [
                { fill: '#2dd4bf', stroke: '#14b8a6' }, // Teal
                { fill: '#67e8f9', stroke: '#06b6d4' }, // Cyan
                { fill: '#a5f3fc', stroke: '#67e8f9' }, // Light Blue
                { fill: '#f0fdf4', stroke: '#bbf7d0' }, // Mint White
                { fill: '#3b82f6', stroke: '#2563eb' }, // Royal Blue
                { fill: '#ffffff', stroke: '#e2e8f0' }, // Pure White
            ];
            
            if (type === 'gold') {
                return Bodies.circle(x, y, size, {
                    restitution: 0.5, 
                    friction: 0.05,
                    density: 0.005,
                    render: { fillStyle: '#fbbf24', strokeStyle: '#f59e0b', lineWidth: 4 },
                    label: 'capsule'
                });
            }

            const color = colors[Math.floor(Math.random() * colors.length)];
            return Bodies.circle(x, y, size, {
                restitution: 0.5, 
                friction: 0.05,   
                density: 0.005,
                render: { fillStyle: color.fill, strokeStyle: color.stroke, lineWidth: 4 },
                label: 'capsule'
            });
        };

        // --- Main App Component ---
        function LotteryApp() {
          const [view, setView] = useState('game'); 
          const [prizes, setPrizes] = useState([]);
          const [codes, setCodes] = useState({}); 
          const [user, setUser] = useState(null);
          const [authError, setAuthError] = useState(false);

          // Authenticate
          useEffect(() => {
            const initAuth = async () => {
                let attempts = 0;
                const maxAttempts = 3;
                while (attempts < maxAttempts) {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                             await signInWithCustomToken(auth, __initial_auth_token); 
                        } else {
                            await signInAnonymously(auth);
                        }
                        setAuthError(false);
                        return; 
                    } catch (error) {
                        console.warn(`Auth attempt ${attempts + 1} failed:`, error);
                        attempts++;
                        await new Promise(r => setTimeout(r, 1000 * attempts));
                    }
                }
                setAuthError(true);
            };
            initAuth();
            
            const unsubscribe = onAuthStateChanged(auth, (u) => {
                if (u) {
                    setUser(u);
                    setAuthError(false);
                }
            });
            return () => unsubscribe();
          }, []);

          // Load Local Data
          useEffect(() => {
            const loadedPrizes = JSON.parse(localStorage.getItem(STORAGE_KEY_PRIZES) || '[]');
            const loadedCodes = JSON.parse(localStorage.getItem(STORAGE_KEY_CODES) || '{}');
            setPrizes(loadedPrizes);
            setCodes(loadedCodes);
          }, []);

          // Save Handlers
          const savePrizes = (newPrizes) => {
            setPrizes(newPrizes);
            localStorage.setItem(STORAGE_KEY_PRIZES, JSON.stringify(newPrizes));
          };

          const saveCodes = (newCodes) => {
            setCodes(newCodes);
            localStorage.setItem(STORAGE_KEY_CODES, JSON.stringify(newCodes));
          };

          return (
            <div className="min-h-screen bg-slate-950 text-white font-sans overflow-hidden select-none">
              {view === 'game' ? (
                <GameInterface 
                  goToAdmin={() => setView('admin')} 
                  codes={codes}
                  saveCodes={saveCodes}
                />
              ) : (
                <AdminInterface 
                  goBack={() => setView('game')}
                  prizes={prizes}
                  setPrizes={savePrizes}
                  codes={codes}
                  setCodes={saveCodes}
                  user={user}
                  authError={authError}
                />
              )}
            </div>
          );
        }

        // --- Game Interface: Gachapon Machine ---
        function GameInterface({ goToAdmin, codes, saveCodes }) {
          const [gamePhase, setGamePhase] = useState('standby');
          const [studentName, setStudentName] = useState('');
          const [inputCode, setInputCode] = useState('');
          const [resultMsg, setResultMsg] = useState(null);
          const [errorMsg, setErrorMsg] = useState('');
          
          const sceneRef = useRef(null);
          const engineRef = useRef(null);
          const stirrerRef = useRef(null);

          // Initialize Physics INSIDE the specific window element
          useEffect(() => {
            if (!sceneRef.current) return;

            if (engineRef.current) {
              World.clear(engineRef.current.world);
              Engine.clear(engineRef.current);
            }

            const width = sceneRef.current.clientWidth;
            const height = sceneRef.current.clientHeight;

            const engine = Engine.create();
            const world = engine.world;
            engineRef.current = engine;

            const render = Render.create({
              element: sceneRef.current,
              engine: engine,
              options: {
                width,
                height,
                wireframes: false,
                background: 'transparent',
                pixelRatio: 2 // High DPI
              }
            });

            // --- Container Bounds ---
            const wallThick = 60;
            const wallOpts = { isStatic: true, render: { visible: false } };
            
            const ground = Bodies.rectangle(width/2, height + 20, width, wallThick, wallOpts);
            const leftWall = Bodies.rectangle(0 - 20, height/2, wallThick, height * 2, wallOpts);
            const rightWall = Bodies.rectangle(width + 20, height/2, wallThick, height * 2, wallOpts);
            const topCap = Bodies.rectangle(width/2, -400, width, wallThick, wallOpts); 

            // Stirrer - Center bottom (Larger for bigger window)
            const stirrer = Bodies.rectangle(width/2, height - 60, 200, 20, {
                isStatic: true,
                render: { fillStyle: '#99f6e4', opacity: 0.9 },
                chamfer: { radius: 10 }
            });
            stirrerRef.current = stirrer;

            // Funnel Slopes
            const leftSlope = Bodies.rectangle(30, height - 120, 120, 20, { ...wallOpts, angle: Math.PI / 4 });
            const rightSlope = Bodies.rectangle(width - 30, height - 120, 120, 20, { ...wallOpts, angle: -Math.PI / 4 });

            World.add(world, [ground, leftWall, rightWall, topCap, stirrer, leftSlope, rightSlope]);

            // --- Spawn Balls ---
            const balls = [];
            for (let i = 0; i < 35; i++) {
                const x = width/2 + (Math.random() - 0.5) * 200;
                const y = -50 - (i * 40); 
                balls.push(createCapsule(x, y));
            }
            World.add(world, balls);

            // --- Loop ---
            let time = 0;
            Events.on(engine, 'beforeUpdate', () => {
                time += 0.05;
                
                if (stirrerRef.current) {
                    if (stirrerRef.current.isRotating) {
                         // Active Mixing: Slow Sine Wave (Wobble)
                         const angle = Math.sin(time * 2) * 0.8; 
                         Body.setAngle(stirrerRef.current, angle);
                         if (Math.random() < 0.02) {
                             Body.setPosition(stirrerRef.current, { x: width/2, y: height - 65 + Math.random() * -5 });
                         }
                    } else {
                         // Idle: Very gentle breathing motion
                         const angle = Math.sin(time * 0.5) * 0.1;
                         Body.setAngle(stirrerRef.current, angle);
                    }
                }
                
                // Remove balls that escaped
                Composite.allBodies(world).forEach(body => {
                    if (body.label === 'capsule' && body.position.y > height + 50) {
                         World.remove(world, body);
                    }
                });
            });

            Runner.run(Runner.create(), engine);
            Render.run(render);

            return () => {
              Render.stop(render);
              World.clear(world);
              Engine.clear(engine);
              if(render.canvas) render.canvas.remove();
            };
          }, []);

          // --- Controls ---
          const handleOpenInput = () => {
            setGamePhase('input');
          };

          const handleStartDraw = () => {
            const codeKey = inputCode.toUpperCase();
            const codeData = codes[codeKey];

            if (!studentName.trim()) { setErrorMsg('請輸入姓名'); return; }
            if (!codeData) { setErrorMsg('無效的代碼'); return; }
            if (codeData.used) { setErrorMsg('此代碼已被使用'); return; }

            setErrorMsg('');
            
            // Phase 1: Mixing (Gentle Waving)
            setGamePhase('turning'); 
            if (stirrerRef.current) stirrerRef.current.isRotating = true;

            const newCodes = { ...codes };
            newCodes[codeKey] = { ...newCodes[codeKey], used: true, student: studentName, usedAt: new Date().toISOString() };
            saveCodes(newCodes);

            // Phase 2: Dropping (Animation)
            setTimeout(() => {
                setGamePhase('dropping');
                if (stirrerRef.current) stirrerRef.current.isRotating = false;
            }, 2500); 

            // Phase 3: Opening
            setTimeout(() => {
                setGamePhase('opening');
            }, 4500); 

            // Phase 4: Result
            setTimeout(() => {
                setResultMsg({
                    win: codeData.type !== 'none',
                    prize: codeData.prizeName,
                    isBig: codeData.type === 'big'
                });
                setGamePhase('result');
                
                // Play Enhanced SFX based on result type
                if (codeData.type === 'big') {
                    playWinSound('big');
                } else if (codeData.type === 'none') {
                    playWinSound('none'); // Sad sound
                } else {
                    playWinSound('small'); // Normal happy sound
                }
                
            }, 6000); 
          };

          const resetGame = () => {
              setGamePhase('standby');
              setStudentName('');
              setInputCode('');
              setResultMsg(null);
          };

          // --- Styles Helper ---
          const getCapsuleStyles = (type) => {
              if (type === 'big') return {
                  background: 'linear-gradient(to bottom, rgba(255,255,255,0.4) 50%, #fbbf24 50%)',
                  borderColor: '#f59e0b'
              };
              return {
                  background: 'linear-gradient(to bottom, rgba(255,255,255,0.4) 50%, #2dd4bf 50%)',
                  borderColor: '#14b8a6'
              };
          };

          return (
            <div className="relative w-full h-screen flex flex-col bg-slate-900 overflow-hidden">
              
              {/* Background Visuals */}
              <div className="absolute inset-0 bg-slate-800 flex items-center justify-center pointer-events-none overflow-hidden">
                   <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-700 to-slate-900 opacity-50"></div>
                   
                   {/* Machine Body */}
                   <div className="relative w-full max-w-2xl h-[92vh] bg-gradient-to-b from-[#2dd4bf] to-[#0d9488] rounded-[3rem] shadow-[0_20px_60px_rgba(0,0,0,0.6),_inset_0_2px_5px_rgba(255,255,255,0.3)] border-x-4 border-t-[12px] border-b-[16px] border-[#115e59] flex flex-col items-center overflow-hidden z-0">
                       
                       {/* Glass Window (Physics Container) - HUGE DOME */}
                       <div className="relative w-[90%] h-[55%] mt-8 bg-white/20 rounded-t-full rounded-b-3xl border-[12px] border-[#e2e8f0] shadow-[inset_0_0_40px_rgba(0,0,0,0.2),_0_15px_30px_rgba(0,0,0,0.3)] z-0 flex items-center justify-center overflow-hidden backdrop-blur-[2px]">
                            {/* Glass Glare - Reduced Opacity */}
                            <div className="absolute inset-0 rounded-t-full rounded-b-3xl bg-[linear-gradient(135deg,rgba(255,255,255,0.15)_0%,rgba(255,255,255,0)_40%,rgba(255,255,255,0)_60%,rgba(255,255,255,0.1)_100%)] pointer-events-none z-20"></div>
                            <div className="absolute top-8 left-10 w-48 h-24 bg-white/30 rounded-full blur-[20px] rotate-[-20deg] z-20"></div>
                            
                            {/* --- PHYSICS RENDER TARGET --- */}
                            <div ref={sceneRef} className="w-full h-full relative z-10" />
                       </div>

                       {/* Controls Area */}
                       <div className="w-full flex-1 bg-gradient-to-b from-[#14b8a6] to-[#0d9488] relative border-t-8 border-[#134e4a] flex flex-col items-center justify-start pt-6 shadow-[inset_0_10px_20px_rgba(0,0,0,0.2)]">
                           
                           {/* Coin Slot */}
                           <div className="flex justify-between w-3/4 mb-4 px-4">
                               <div className="flex flex-col items-center gap-1">
                                   <div className="w-12 h-16 bg-slate-300 rounded border-2 border-slate-400 shadow-inner flex items-center justify-center">
                                       <div className="w-1.5 h-10 bg-slate-800 rounded-full"></div>
                                   </div>
                                   <span className="text-[10px] text-white/80 font-bold tracking-wider">INSERT COIN</span>
                               </div>
                               <div className="flex items-center gap-1 self-end mb-2">
                                    <Coins size={20} className="text-yellow-400 drop-shadow" />
                                    <span className="text-sm text-yellow-400 font-bold drop-shadow">莒光資優Ya!</span>
                               </div>
                           </div>
                           
                           {/* Exit Chute */}
                           <div className="relative w-56 h-48">
                               <div className="absolute top-[-60px] left-1/2 -translate-x-1/2 w-20 h-28 bg-slate-800/80 border-x-4 border-slate-900 z-0 mask-image: linear-gradient(to bottom, black 50%, transparent 100%)"></div>
                               
                               <div className="w-full h-full bg-gradient-to-b from-slate-700 to-slate-900 rounded-t-[3.5rem] border-[8px] border-slate-600 shadow-[inset_0_15px_30px_rgba(0,0,0,0.7),_0_5px_10px_rgba(255,255,255,0.1)] flex items-end justify-center overflow-hidden relative z-10">
                                   <div className="absolute bottom-0 w-full h-1/3 bg-black/60 rounded-t-[2.5rem]"></div>
                                   <div className="absolute bottom-3 w-3/4 h-3 bg-slate-600/50 rounded-full"></div>
                               </div>

                               {/* Falling Capsule (Animation) */}
                               {gamePhase === 'dropping' && (
                                   <div className="absolute top-[-40px] left-1/2 -translate-x-1/2 z-5 animate-internal-drop">
                                       <div 
                                            className="w-14 h-14 rounded-full border-2 shadow-md flex flex-col overflow-hidden relative box-border animate-spin-slow"
                                            style={getCapsuleStyles(resultMsg?.isBig ? 'big' : 'normal')}
                                       >
                                           <div className="absolute top-1/2 left-0 w-full h-0.5 bg-black/10 -translate-y-1/2 z-20"></div>
                                           <div className="absolute top-0 left-0 w-full h-1/2 bg-white/20 backdrop-blur-sm z-10"></div>
                                       </div>
                                   </div>
                               )}
                           </div>
                       </div>
                   </div>
              </div>

              {/* Handle Visual (Separate Layer) */}
              <div className="absolute inset-0 z-20 flex flex-col items-center justify-end pb-[18vh] pointer-events-none">
                  <div className="relative pointer-events-auto transform translate-y-2">
                      <div className="absolute inset-0 bg-slate-300 rounded-full shadow-[0_5px_0_#94a3b8] scale-110 z-0"></div>
                      <div 
                        className={`w-40 h-40 bg-gradient-to-br from-white to-slate-200 rounded-full border-[8px] border-slate-300 shadow-[inset_0_2px_5px_rgba(255,255,255,0.5),_0_10px_20px_rgba(0,0,0,0.2)] flex items-center justify-center relative z-10
                            ${gamePhase === 'turning' ? 'animate-wobble-spin' : ''}
                        `}
                        style={{ animationDuration: '1s', animationIterationCount: 'infinite' }}
                      >
                           <div className="w-32 h-8 bg-slate-300 rounded-full absolute shadow-inner"></div>
                           <div className="w-8 h-32 bg-slate-300 rounded-full absolute shadow-inner"></div>
                           <div className="w-16 h-16 bg-gradient-to-br from-[#2dd4bf] to-[#0d9488] rounded-full absolute z-20 border-4 border-white/80 shadow-md"></div>
                      </div>
                  </div>
              </div>

              {/* Standby Button */}
              {gamePhase === 'standby' && (
                  <div className="absolute inset-0 z-30 flex items-center justify-center">
                      <button onClick={handleOpenInput} className="group relative">
                          <div className="absolute inset-0 bg-[#2dd4bf] rounded-full animate-ping opacity-50"></div>
                          <div className="relative bg-gradient-to-br from-[#5eead4] to-[#2dd4bf] text-white font-black text-3xl w-52 h-52 rounded-full border-8 border-white/80 shadow-[0_10px_40px_rgba(13,148,136,0.6)] flex flex-col items-center justify-center gap-3 transform transition hover:scale-105 active:scale-95 active:shadow-none">
                              <Play fill="white" size={48} className="drop-shadow" />
                              <span className="drop-shadow">我要扭蛋</span>
                          </div>
                      </button>
                      <div className="absolute bottom-6 right-6 z-40">
                          <button onClick={goToAdmin} className="bg-slate-800/80 text-white p-3 rounded-full hover:bg-slate-700 transition shadow-lg border border-white/10">
                              <Settings size={24} />
                          </button>
                      </div>
                  </div>
              )}

              {/* Input Overlay */}
              {gamePhase === 'input' && (
                <div className="absolute inset-0 z-30 flex items-center justify-center bg-black/70 backdrop-blur-sm animate-fade-in">
                   <div className="bg-white/95 p-8 rounded-[2.5rem] shadow-2xl w-full max-w-md mx-4 text-center border-[8px] border-[#2dd4bf] relative overflow-hidden">
                      <div className="absolute inset-0 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-[#ccfbf1] via-transparent to-transparent opacity-50 pointer-events-none"></div>
                      <button onClick={() => setGamePhase('standby')} className="absolute top-5 right-5 text-slate-400 hover:text-slate-600 transition bg-slate-100 rounded-full p-2">✕</button>
                      <h2 className="text-3xl font-black text-[#0d9488] mb-8 mt-2 flex items-center justify-center gap-2">
                          <Coins size={32}/> 投入代幣
                      </h2>
                      <div className="space-y-6 relative z-10">
                        <input type="text" value={studentName} onChange={e => setStudentName(e.target.value)} className="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl px-6 py-4 text-slate-800 font-bold text-lg focus:outline-none focus:border-[#2dd4bf] transition shadow-inner" placeholder="姓名" />
                        <input type="text" maxLength={3} value={inputCode} onChange={e => setInputCode(e.target.value.toUpperCase())} className="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl px-6 py-4 text-slate-800 text-5xl font-mono text-center tracking-[0.5em] focus:outline-none focus:border-[#2dd4bf] uppercase transition shadow-inner" placeholder="ABC" />
                        {errorMsg && <p className="text-red-500 font-bold animate-pulse bg-red-50 py-2 rounded-lg">{errorMsg}</p>}
                        <button onClick={handleStartDraw} className="w-full bg-gradient-to-r from-[#2dd4bf] to-[#0d9488] hover:from-[#14b8a6] hover:to-[#0f766e] text-white font-black text-2xl py-5 rounded-2xl shadow-xl transform active:scale-95 transition flex items-center justify-center gap-3">
                            <RotateCcw size={28} /> 轉動扭蛋
                        </button>
                      </div>
                   </div>
                </div>
              )}

              {/* Opening Animation */}
              {(gamePhase === 'opening') && (
                  <div className="absolute inset-0 z-40 bg-black/40 flex items-end justify-center overflow-hidden pb-[20vh]">
                      <div className="relative animate-pop-out-open">
                           <div 
                                className="w-56 h-56 rounded-full border-[8px] shadow-[0_20px_50px_rgba(0,0,0,0.4)] flex flex-col overflow-hidden relative box-border"
                                style={getCapsuleStyles(resultMsg?.isBig ? 'big' : 'normal')}
                           >
                               <div className="absolute top-1/2 left-0 w-full h-2 bg-black/10 -translate-y-1/2 z-20"></div>
                               <div className="absolute top-0 left-0 w-full h-1/2 origin-bottom transition-transform duration-[1500ms] ease-out-back z-10 bg-white/30 backdrop-blur-md animate-open-lid"></div>
                               <div className="absolute inset-0 bg-white animate-ping opacity-80 z-0 delay-500"></div>
                               <Sparkles size={80} className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-white animate-pulse z-30 drop-shadow-lg" />
                           </div>
                      </div>
                  </div>
              )}

              {/* Result Modal */}
              {gamePhase === 'result' && resultMsg && (
                  <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/80 p-4">
                      <div className="bg-white p-12 rounded-[3rem] max-w-sm w-full text-center animate-fade-in relative overflow-hidden shadow-[0_20px_60px_rgba(13,148,136,0.6)] border-[8px] border-[#2dd4bf]">
                          {resultMsg.win ? (
                              <>
                                <div className="absolute top-0 left-0 w-full h-1/2 bg-gradient-to-b from-yellow-100 to-transparent -z-10"></div>
                                <div className="mb-8 animate-bounce"><Award size={120} className={`mx-auto ${resultMsg.isBig ? 'text-yellow-500 drop-shadow-xl' : 'text-[#2dd4bf] drop-shadow-lg'}`} /></div>
                                <h2 className="text-5xl font-black text-slate-800 mb-4 tracking-tight">{resultMsg.isBig ? '🎉 大獎！' : '恭喜！'}</h2>
                                <div className="bg-[#f0fdfa] p-8 rounded-3xl border-4 border-[#99f6e4] my-8 shadow-inner relative overflow-hidden">
                                    <p className="text-slate-500 text-sm font-bold uppercase mb-2 tracking-widest relative z-10">You Won</p>
                                    <p className="text-4xl font-bold text-slate-800 break-words relative z-10">{resultMsg.prize}</p>
                                </div>
                              </>
                          ) : (
                              <>
                                <div className="absolute top-0 left-0 w-full h-4 bg-slate-200"></div>
                                <div className="mb-8 opacity-60"><CircleDot size={100} className="mx-auto text-slate-400" /></div>
                                <h2 className="text-4xl font-black text-slate-600 mb-4">銘謝惠顧</h2>
                                <p className="text-slate-500 mb-10 font-bold text-lg">裡面只有一張「下次好運」的紙條...</p>
                              </>
                          )}
                          <button onClick={resetGame} className="w-full bg-gradient-to-r from-[#0f766e] to-[#115e59] hover:from-[#134e4a] hover:to-[#134e4a] text-white font-black text-xl py-5 rounded-2xl shadow-xl transition transform hover:scale-105">
                            領取完成
                          </button>
                      </div>
                  </div>
              )}
            </div>
          );
        }

        // Admin Interface
        function AdminInterface({ goBack, prizes, setPrizes, codes, setCodes, user, authError }) {
          const [password, setPassword] = useState('');
          const [isAuthenticated, setIsAuthenticated] = useState(false);
          const [activeTab, setActiveTab] = useState('settings');
          const handleLogin = () => { if (password === ADMIN_PASSWORD) setIsAuthenticated(true); else alert('密碼錯誤'); };
          
          const [newPrizeName, setNewPrizeName] = useState('');
          const [newPrizeCount, setNewPrizeCount] = useState(1);
          const [newPrizeType, setNewPrizeType] = useState('small');
          
          const handleAddPrize = () => { 
              if (!newPrizeName) return; 
              // Safe ID generation
              const nextId = prizes.length > 0 ? Math.max(...prizes.map(p => p.displayId)) + 1 : 1;
              setPrizes([...prizes, { 
                  id: Date.now(), 
                  name: newPrizeName, 
                  count: parseInt(newPrizeCount), 
                  type: newPrizeType, 
                  displayId: nextId 
              }]); 
              setNewPrizeName(''); 
              setNewPrizeCount(1); 
          };
          
          const removePrize = (id) => setPrizes(prizes.filter(p => p.id !== id));
          
          const handleGenerateCodes = () => { 
              if (prizes.length === 0) { alert("請先新增獎品項目"); return; }
              
              const updatedCodes = { ...codes };
              let addedCount = 0;

              prizes.forEach(prize => {
                  // Count existing codes for this prize ID
                  const currentCount = Object.values(updatedCodes).filter(c => c.prizeId === prize.displayId).length;
                  const needed = prize.count - currentCount;

                  if (needed > 0) {
                      for(let i=0; i < needed; i++) {
                          let code = generateCode();
                          while(updatedCodes[code]) code = generateCode();
                          
                          updatedCodes[code] = {
                              prizeId: prize.displayId,
                              prizeName: prize.name,
                              type: prize.type,
                              used: false
                          };
                          addedCount++;
                      }
                  }
              });

              setCodes(updatedCodes);
              if (addedCount > 0) {
                  alert(`已補足生成 ${addedCount} 組新代碼！(總代碼數: ${Object.keys(updatedCodes).length})`);
              } else {
                  alert("目前代碼數量已足夠，無需生成。（若需更多代碼，請增加獎品數量）");
              }
          };

          const handleClearCodes = () => {
              if(confirm("確定要清除所有代碼嗎？此操作無法復原！")) {
                  setCodes({});
                  alert("已清除所有代碼");
              }
          };

          const [cloudId, setCloudId] = useState('');
          useEffect(() => {
              const storedId = localStorage.getItem(STORAGE_KEY_CLOUD_ID);
              if (storedId) {
                  setCloudId(storedId);
              } else {
                  const newId = 'GAME-' + Math.floor(1000 + Math.random() * 9000);
                  setCloudId(newId);
                  localStorage.setItem(STORAGE_KEY_CLOUD_ID, newId);
              }
          }, []);

          const saveCloudId = (id) => {
              setCloudId(id);
              localStorage.setItem(STORAGE_KEY_CLOUD_ID, id);
          };

          const [isLoading, setIsLoading] = useState(false);
          
          // Use PUBLIC path for easy cross-device sharing based on cloudId
          const handleAutoSave = async () => { 
              if(authError) return alert("離線模式無法存檔"); 
              setIsLoading(true); 
              try{ 
                  // Save to artifacts/{appId}/public/data/{cloudId}
                  await setDoc(doc(db, 'artifacts', appId, 'public', 'data', CLOUD_COLLECTION_NAME, cloudId), {
                      prizes,
                      codes,
                      updatedAt: new Date().toISOString()
                  }); 
                  alert("保存成功！"); 
              } catch(e) { alert('保存失敗: ' + e.message); } 
              setIsLoading(false); 
          };
          
          const handleAutoLoad = async () => { 
              if(authError) return alert("離線模式無法讀取"); 
              setIsLoading(true); 
              try{ 
                  const s = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', CLOUD_COLLECTION_NAME, cloudId)); 
                  if(s.exists()){ 
                      const d = s.data(); 
                      setPrizes(d.prizes||[]); 
                      setCodes(d.codes||{}); 
                      alert("讀取成功！"); 
                  } else { 
                      alert("找不到此代號的存檔"); 
                  } 
              } catch(e) { alert('讀取失敗: ' + e.message); } 
              setIsLoading(false); 
          };
          
          // --- Updated Exports ---
          const downloadDoc = (html, filename) => {
              const blob = new Blob([html], { type: 'application/msword' });
              const link = document.createElement('a');
              link.href = URL.createObjectURL(blob);
              link.download = filename;
              link.click();
          };

          const exportCodes = () => {
            if (Object.keys(codes).length === 0) return;
            let htmlBody = `
              <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word'>
              <head><meta charset='utf-8'><title>抽獎代碼條</title>
              <style>
                body { font-family: 'Microsoft JhengHei'; }
                table { border-collapse: collapse; width: 100%; }
                td { border: 1px solid #000; padding: 10px; text-align: center; vertical-align: middle; height: 100px; }
                .code { font-size: 24px; font-weight: bold; }
                .blessing { font-size: 12px; color: #555; margin-top: 5px; }
                .id { font-size: 10px; color: #999; margin-bottom: 5px; }
              </style>
              </head><body>
              <table>
            `;

            const codeEntries = Object.entries(codes).sort(() => Math.random() - 0.5); 
            
            let rows = [];
            let currentRow = [];
            codeEntries.forEach(([code, data], index) => {
                currentRow.push(`
                    <td width="33%">
                        <div class="id">No. ${index + 1}</div>
                        <div class="code">${code}</div>
                        <div class="blessing">🎉 祝您中大獎 🎉<br/>莒光資優Ya!</div>
                    </td>
                `);
                if (currentRow.length === 3) {
                    rows.push(`<tr>${currentRow.join('')}</tr>`);
                    currentRow = [];
                }
            });
            if (currentRow.length > 0) {
                rows.push(`<tr>${currentRow.join('')}</tr>`);
            }
            
            htmlBody += rows.join('');
            htmlBody += `</table></body></html>`;
            downloadDoc(htmlBody, "代碼條_列印用.doc");
          };

          const exportFullList = () => {
            if (Object.keys(codes).length === 0) return;
            let htmlBody = `
              <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word'>
              <head><meta charset='utf-8'><title>Checklist</title>
              <style>
                body { font-family: 'Microsoft JhengHei'; }
                table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
                th, td { border: 1px solid #000; padding: 8px; text-align: center; }
                th { background-color: #f0f0f0; }
                .title { font-size: 18px; font-weight: bold; margin-bottom: 10px; margin-top: 20px; }
                .left { text-align: left; }
              </style>
              </head><body>
              
              <div class="title">一、獎品總表</div>
              <table>
                <tr><th>編號</th><th>名稱</th><th>數量</th><th>類型</th></tr>
                ${prizes.map((p,i) => `<tr><td>${i+1}</td><td class="left">${p.name}</td><td>${p.count}</td><td>${p.type==='big'?'大獎':(p.type==='none'?'沒中':'普通')}</td></tr>`).join('')}
              </table>

              <div class="title">二、代碼核銷檢核表</div>
              <table>
                <tr><th>標籤 (類型)</th><th>代碼</th><th>對應獎品</th><th>獲獎人</th><th>核銷註記</th></tr>
                ${Object.entries(codes).sort((a,b) => a[0].localeCompare(b[0])).map(([c, d]) => {
                    let label = '普通';
                    if(d.type === 'big') label = '★大獎★';
                    if(d.type === 'none') label = '沒中';
                    
                    return `
                    <tr>
                        <td>${label}</td>
                        <td style="font-family: monospace; font-size: 1.2em; font-weight: bold;">${c}</td>
                        <td class="left">${d.prizeName}</td>
                        <td>${d.student || ''}</td>
                        <td>${d.used ? '已領取' : '⬜'}</td>
                    </tr>
                    `;
                }).join('')}
              </table>
              </body></html>
            `;
            downloadDoc(htmlBody, "獎品核銷檢核表.doc");
          };

          const [searchTerm, setSearchTerm] = useState('');

          if (!isAuthenticated) return (
              <div className="flex h-screen items-center justify-center bg-slate-900">
                <div className="bg-slate-800 p-8 rounded-xl w-80 text-center shadow-2xl border border-slate-700 text-white">
                    <Lock size={40} className="mx-auto text-yellow-500 mb-4" />
                    <h2 className="text-xl font-bold mb-4">教師登入</h2>
                    <input type="password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full bg-slate-700 p-2 rounded mb-4 text-center text-white" placeholder="請輸入密碼" />
                    <button onClick={handleLogin} className="w-full bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-2 rounded">進入</button>
                    <button onClick={goBack} className="w-full mt-2 text-slate-400 text-sm hover:text-white">返回</button>
                </div>
              </div>
          );

          return (
            <div className="min-h-screen bg-slate-950 text-white p-4 overflow-y-auto">
              <div className="max-w-5xl mx-auto">
                <div className="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
                    <h1 className="text-2xl font-bold flex items-center gap-2"><Settings className="text-yellow-500" /> 後台管理</h1>
                    <div className="flex bg-slate-900 rounded p-1">
                        {['settings', 'verify', 'cloud'].map(t => (
                            <button key={t} onClick={()=>setActiveTab(t)} className={`px-4 py-2 rounded capitalize ${activeTab===t?'bg-blue-600 text-white':'text-slate-400'}`}>{t}</button>
                        ))}
                    </div>
                    <button onClick={goBack} className="bg-slate-800 px-4 py-2 rounded">離開</button>
                </div>
                {activeTab === 'settings' && (
                    <div className="grid md:grid-cols-2 gap-6">
                        <div className="bg-slate-900 p-4 rounded-lg border border-slate-800">
                            <h3 className="font-bold mb-4 text-pink-400">新增獎品</h3>
                            <div className="space-y-2 mb-4">
                                <input type="text" value={newPrizeName} onChange={e=>setNewPrizeName(e.target.value)} className="w-full bg-slate-800 border border-slate-700 p-2 rounded" placeholder="名稱" />
                                <div className="flex gap-2">
                                    <input type="number" value={newPrizeCount} onChange={e=>setNewPrizeCount(e.target.value)} className="w-1/3 bg-slate-800 border border-slate-700 p-2 rounded" />
                                    <select value={newPrizeType} onChange={e=>setNewPrizeType(e.target.value)} className="w-2/3 bg-slate-800 border border-slate-700 p-2 rounded"><option value="small">普通</option><option value="big">大獎</option><option value="none">沒中</option></select>
                                </div>
                                <button onClick={handleAddPrize} className="w-full bg-green-600 hover:bg-green-500 py-2 rounded font-bold">新增</button>
                            </div>
                            <div className="h-64 overflow-y-auto space-y-2">{prizes.map((p,i)=>(<div key={p.id} className="flex justify-between bg-slate-800 p-2 rounded items-center"><span>#{i+1} {p.name} <small className="text-slate-400">x{p.count}</small></span><button onClick={()=>removePrize(p.id)} className="text-red-400"><Trash2 size={16}/></button></div>))}</div>
                        </div>
                        <div className="bg-slate-900 p-4 rounded-lg border border-slate-800 text-center flex flex-col justify-center gap-4">
                            <div className="text-4xl font-bold">{Object.keys(codes).length}</div>
                            <div className="text-slate-500">總代碼數</div>
                            <button onClick={handleGenerateCodes} className="bg-blue-600 py-3 rounded font-bold w-full flex items-center justify-center gap-2"><RefreshCw size={18}/> 生成/補足亂碼</button>
                            <button onClick={handleClearCodes} className="bg-red-600/20 text-red-400 hover:bg-red-600/40 py-2 rounded text-sm w-full">清除所有代碼</button>
                            <div className="grid grid-cols-2 gap-2 w-full mt-2"><button onClick={exportCodes} disabled={!Object.keys(codes).length} className="bg-yellow-600 hover:bg-yellow-500 py-3 rounded font-bold disabled:opacity-50 text-sm"><Download size={18}/> 僅匯出亂碼條</button><button onClick={exportFullList} disabled={!Object.keys(codes).length} className="bg-emerald-600 hover:bg-emerald-500 py-3 rounded font-bold disabled:opacity-50 text-sm"><FileText size={18}/> 匯出核銷清單</button></div>
                        </div>
                    </div>
                )}
                {activeTab === 'verify' && (
                    <div className="bg-slate-900 p-4 rounded-lg border border-slate-800 h-[70vh] flex flex-col">
                        <div className="flex gap-2 mb-4"><Search className="text-slate-400" /><input type="text" placeholder="搜尋代碼 (ABC)..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value.toUpperCase())} className="bg-transparent border-b border-slate-700 focus:outline-none w-full text-white" /></div>
                        <div className="overflow-y-auto flex-1"><table className="w-full text-left text-sm"><thead className="text-slate-500 sticky top-0 bg-slate-900"><tr><th className="p-2">代碼</th><th className="p-2">獎品</th><th className="p-2">狀態</th></tr></thead><tbody>{Object.entries(codes).filter(([c])=>c.includes(searchTerm)).map(([code, d])=>(<tr key={code} className="border-b border-slate-800 hover:bg-slate-800/50"><td className="p-2 font-mono text-yellow-500 font-bold">{code}</td><td className="p-2">#{d.prizeId} {d.prizeName}</td><td className="p-2">{d.used ? <span className="text-red-400">已換 ({d.student})</span> : <span className="text-green-500">未換</span>}</td></tr>))}</tbody></table></div>
                    </div>
                )}
                {activeTab === 'cloud' && (
                    <div className="bg-slate-900 p-8 rounded-lg border border-slate-800 text-center max-w-lg mx-auto">
                        {authError ? (<div className="mb-6"><WifiOff size={48} className="mx-auto text-red-500 mb-4"/><h3 className="text-2xl font-bold text-red-500 mb-2">離線模式</h3></div>) : (
                            <>
                                <Cloud size={64} className="mx-auto text-blue-500 mb-6"/>
                                <h3 className="text-2xl font-bold mb-2">雲端備份與同步</h3>
                                <p className="text-slate-400 mb-6">
                                    輸入或複製下方的「活動代號」以在不同裝置間同步資料。
                                </p>
                                
                                <div className="flex items-center gap-2 mb-8 bg-slate-800 p-2 rounded-lg border border-slate-600">
                                    <span className="text-slate-400 pl-2 text-sm whitespace-nowrap">活動代號:</span>
                                    <input 
                                        type="text" 
                                        value={cloudId} 
                                        onChange={(e) => saveCloudId(e.target.value.toUpperCase())}
                                        className="bg-transparent text-yellow-400 font-mono font-bold text-xl text-center w-full focus:outline-none"
                                    />
                                    <button onClick={() => {navigator.clipboard.writeText(cloudId); alert('已複製代號！');}} className="p-2 bg-slate-700 rounded hover:bg-slate-600">
                                        <Copy size={18} />
                                    </button>
                                </div>

                                <div className="grid grid-cols-2 gap-4">
                                    <button onClick={handleAutoSave} disabled={isLoading} className="bg-green-600 hover:bg-green-500 py-4 rounded-xl font-bold text-lg flex flex-col items-center gap-2"><CloudUpload /> {isLoading ? '處理中...' : '保存至此代號'}</button>
                                    <button onClick={handleAutoLoad} disabled={isLoading} className="bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold text-lg flex flex-col items-center gap-2"><CloudDownload /> {isLoading ? '處理中...' : '從此代號讀取'}</button>
                                </div>
                                <p className="mt-4 text-xs text-slate-500">注意：請記住您的活動代號，以便在其他裝置存取。</p>
                            </>
                        )}
                    </div>
                )}
              </div>
            </div>
          );
        }

        // --- Render Application ---
        const root = createRoot(document.getElementById('root'));
        root.render(<LotteryApp />);
    </script>
</body>
</html>
